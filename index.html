<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mudhelli Ayaan Kumar - Dhoti Ceremony</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- The Interactive Envelope -->
        <div class="envelope" id="envelope">
            <span class="envelope-text">💌 Tap to Open Invitation</span>
        </div>

        <!-- The Invitation Card -->
        <div class="invitation-card" id="invitation">
            <h2>Dhoti Ceremony</h2>
            <p class="subtitle">You are cordially invited to celebrate the auspicious Dhoti Ceremony of our son</p>
            
            <h3 class="child-name">Mudhelli Ayaan Kumar</h3>
            
            <div class="details">
                <p><strong>Date:</strong> 12-Sep-2026</p>
                <p><strong>Venue:</strong> Grand Ballroom, Hyderabad</p>
            </div>

            <div class="parents">
                <p><em>With best compliments from:</em></p>
                <p><strong>Mudhelli Prashanthi & Mudhelli Bhanu Prasad</strong></p>
            </div>

            <button onclick="window.print()">Save / Print Invitation</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
