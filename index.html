<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhoti Ceremony Invitation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- The Envelope -->
        <div class="envelope" id="envelope">
            <div class="envelope-flap"></div>
            <div class="envelope-body"></div>
        </div>

        <!-- The Invitation Card (Hidden initially) -->
        <div class="invitation-card" id="invitation">
            <h1>Dhoti Ceremony</h1>
            <p>We cordially invite you to celebrate our son's Dhoti Ceremony.</p>
            <p><strong>Date:</strong> 25th September 2026</p>
            <p><strong>Venue:</strong> Grand Ballroom, Hyderabad</p>
            <button onclick="window.print()">Save Invitation</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
