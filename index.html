<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dhoti Ceremony - Mudhelli Ayaan Kumar</title>
    <!-- Royal Traditional Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&family=Marcellus&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=8">
</head>
<body>

    <!-- Background Music Control -->
    <button id="musicToggle" class="music-btn" aria-label="Toggle Music">🔊 Music On</button>
    <audio id="bgMusic" loop preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=indian-traditional-flute-112328.mp3" type="audio/mpeg">
    </audio>

    <!-- Main Outer Screen Wrapper -->
    <div class="main-wrapper">
        <!-- Left Golden Mandala Ornament -->
        <div class="mandala mandala-left"></div>
        
        <!-- Right Golden Mandala Ornament -->
        <div class="mandala mandala-right"></div>

        <!-- Central Royal Vertical Panel -->
        <div class="card-wrapper">
            <!-- Scratch Envelope Canvas Overlay -->
            <canvas id="scratchCanvas"></canvas>

            <!-- Invitation Content -->
            <div class="invitation-card">
                <div class="card-inner">
                    <div class="blessing">|| Shree Ganeshay Namah ||</div>
                    
                    <p class="invite-tag">You are Cordially invited<br>to the Dhoti Ceremony of</p>
                    
                    <h1 class="child-name">Mudhelli Ayaan Kumar</h1>
                    
                    <div class="divider">✦ ✦ ✦</div>
                    
                    <div class="date-box">
                        <p class="save-date">SAVE THE DATE</p>
                        <p class="date-text">Saturday, 12th September 2026</p>
                    </div>

                    <div class="parents-box">
                        <p class="compliments">Soliciting your presence & blessings:</p>
                        <p class="parents-names">Mudhelli Prashanthi<br>& Mudhelli Bhanu Prasad</p>
                    </div>

                    <!-- Event Location Button -->
                    <a href="https://maps.app.goo.gl/axco1g3UQFD7TJo7A?g_st=awb" target="_blank" class="location-btn">
                        <span class="pulse-pin">📍</span> Get Event Location
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js?v=8"></script>
</body>
</html>
