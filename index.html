<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dhoti Ceremony Invitation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Audio Element -->
  <audio id="bgMusic" loop preload="auto">
    <source src="bg-music.mp3" type="audio/mpeg">
  </audio>

  <!-- Falling Animation Overlay -->
  <div id="fallingContainer"></div>

  <div class="card-container">
    <div class="scroll-card" id="scrollCard">
      <div class="scroll-roller top-roller"></div>
      
      <div class="scroll-body">
        <div class="scroll-content">
          <p class="scratch-instruction">✨ Scratch below to reveal the invitation ✨</p>
          
          <!-- Scratch Card Wrapper -->
          <div class="scratch-container">
            <img id="cardImage" src="invitation.jpg" alt="Dhoti Ceremony Invitation">
            <canvas id="scratchCanvas"></canvas>
          </div>
        </div>
      </div>

      <div class="scroll-roller bottom-roller"></div>
    </div>

    <button id="openBtn" class="open-btn">Open Scroll</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
