<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traditional Event Invitation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Falling Flower Petals Container -->
  <div id="fallingContainer"></div>

  <!-- Main Scroll Card Layout -->
  <div class="card-container">
    <div class="scroll-card" id="scrollCard">
      <div class="scroll-roller"></div>
      
      <div class="scroll-body">
        <div class="scroll-content">
          <div class="scratch-instruction">Scratch to reveal invitation!</div>
          
          <div class="scratch-container">
            <img id="cardImage" src="card-reveal.jpg" alt="Invitation Card">
            <canvas id="scratchCanvas"></canvas>
          </div>

          <a href="https://maps.google.com" target="_blank" class="location-btn">📍 View Event Location</a>
        </div>
      </div>

      <div class="scroll-roller"></div>
    </div>

    <button class="open-btn" id="openBtn">Open Invitation</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
